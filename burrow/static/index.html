<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burrow</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2a65a'/%3E%3Cpath d='M12 10l11 6-11 6z' fill='%23161311'/%3E%3C/svg%3E">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div id="login" class="login hidden">
    <form id="loginForm" class="glass">
      <div class="brand big"><span class="logo"></span>Burrow</div>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button>Enter</button>
      <p id="loginErr" class="err"></p>
    </form>
  </div>

  <header class="topbar glass">
    <a class="brand" href="#/"><span class="logo"></span>Burrow</a>
    <nav class="tabs">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/movies" data-nav="movies">Movies</a>
      <a href="#/tv" data-nav="tv">TV Shows</a>
      <a href="#/music" data-nav="music">Music</a>
      <a href="#/genres" data-nav="genres">Genres</a>
    </nav>
    <div class="tools">
      <input id="search" type="search" placeholder="Search…">
      <button id="scanBtn" class="pill" title="Rescan library">↻ <span>Rescan</span></button>
    </div>
  </header>

  <main>
    <section id="view"></section>
    <p class="private">Private &amp; local. Nothing leaves this device.</p>
  </main>

  <div id="modal" class="modal hidden"><div class="sheet glass" id="sheet"></div></div>

  <div id="player" class="player hidden">
    <button class="close" id="closePlayer" aria-label="Close">✕</button>
    <div class="ptitle" id="ptitle"></div>
    <div class="osd hidden" id="osd"></div>
    <video id="video" controls playsinline></video>
  </div>

  <div id="audiobar" class="audiobar glass hidden">
    <div class="ab-meta"><strong id="abTitle"></strong><span id="abArtist"></span></div>
    <audio id="audio" controls></audio>
  </div>

  <script src="/app.js"></script>
</body>
</html>
